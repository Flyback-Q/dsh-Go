name: Build Custom APK

on:
  # 只保留手动触发。fork 仓库的 schedule 会被 GitHub 静默跳过，且高频自动构建会拉高账号风控。
  # 自动同步改由外部 cron 调 workflow_dispatch 完成（带 sha 去重 + 6h 最小间隔）。
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  DSH_MAVEN_MIRRORS: '0'
  TZ: Asia/Shanghai

jobs:
  sync-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check and merge upstream
        id: check
        run: |
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git
          git fetch upstream main
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          NEW_COMMITS=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream ahead by $NEW_COMMITS commit(s)."

          if [ "$NEW_COMMITS" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge upstream/main -X ours --no-commit --no-ff
            # Keep our .github/workflows intact so GITHUB_TOKEN can push without workflow scope
            git checkout HEAD -- .github
            git commit -m "chore: merge upstream ccch1mneyyy/dsh-Go/main"
            git push origin main
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: already up to date, proceeding to build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Already up to date with upstream. Skipping build."
          echo "should_build=false" >> "$GITHUB_OUTPUT"

  build-apk:
    needs: sync-upstream
    if: needs.sync-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore runtime download cache
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      - name: Build arm64 runtime
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Save runtime download cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Flutter pub get & local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Install Android NDK 28.2.13676358
        run: |
          SDKM=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKM" "ndk;28.2.13676358" > /dev/null
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Configure persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.p12
          storePassword=$KEYSTORE_PASS
          keyAlias=jingniang
          keyPassword=$KEYSTORE_PASS
          EOF

      - name: Build arm64 release APK
        run: DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --keep-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jingniang-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        # 仅手动触发时发布 Release；其余运行只留 14 天 artifact，
        # 避免 231 MB 资产反复堆积占仓库配额、触发平台体积风控。
        # 说明由本次构建现场生成：版本、提交、上游 sha、APK 大小与哈希，
        # 以及自上一版以来的提交标题，不再是一句固定文案。
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA_FULL: ${{ github.sha }}
          UPSTREAM_SHA: ${{ needs.sync-upstream.outputs.upstream_sha }}
        run: |
          set -e
          VER=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          TAG="v${VER:-1.2.0}-$(date +%Y%m%d%H%M)"
          APK=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          SIZE=$(stat -c%s "$APK")
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          SHORT=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)

          # 上一个 Release 就是上一次的基线（此时新的还没建）
          PREV=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          CHANGES=""
          if [ -n "$PREV" ]; then
            CHANGES=$(gh api "repos/$REPO/compare/${PREV}...${SHA_FULL}" \
              --jq '.commits[:25][] | "- " + (.commit.message | split("\n")[0])' 2>/dev/null || true)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- 与上一版没有可比较的提交（同一次构建重发）"
          fi

          UPS="${UPSTREAM_SHA:0:8}"
          if [ -z "$UPS" ]; then UPS="未记录"; fi

          {
            echo "**本次构建**"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${VER:-1.2.0}\` |"
            echo "| 提交 | \`$SHORT\` $SUBJECT |"
            echo "| 上游 ccch1mneyyy/dsh-Go | \`$UPS\` |"
            echo "| APK | $SIZE 字节 · arm64-v8a |"
            echo "| SHA-256 | \`$HASH\` |"
            echo ""
            echo "**自上一版 ${PREV:-（无）} 以来的改动**"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "**固定定制项**"
            echo ""
            echo "- 应用名 鲸鱼娘；包名 \`io.github.flybackq.jingniang\`"
            echo "- 签名：jingniang 固定密钥，可直接覆盖安装"
            echo "- 图标：纯白底桌面图标（吉祥物比例 +5%）与透明白剪影通知图标"
            echo "- 澎湃超级岛：强制简短状态，不依赖 XiaomiFocus 权限"
            echo "- 远程：支持 \`wss://\` WebSocket SSH（Cloudflare Tunnel）"
            echo "- 插件页：在线导入（npm / Git / tarball）与文件导入（.tgz / .dshgo）"
          } > "$RUNNER_TEMP/notes.md"

          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK" \
            --repo "$REPO" \
            --title "鲸鱼娘 $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
