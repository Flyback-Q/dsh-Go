name: Build Custom APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  DSH_MAVEN_MIRRORS: '0'
  TZ: Asia/Shanghai

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore runtime download cache
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      - name: Build arm64 runtime
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Save runtime download cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Flutter pub get & local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Install Android NDK 28.2.13676358
        run: |
          SDKM=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKM" "ndk;28.2.13676358" > /dev/null
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Build arm64 release APK
        run: DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --keep-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jingniang-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.0-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" app/build/app/outputs/flutter-apk/app-arm64-release.apk \
            --title "鲸鱼娘 $TAG" \
            --notes "自定义名称：鲸鱼娘；包名：io.github.flybackq.jingniang；纯白背景桌面图标与通知图标；新增纯白主题配色。"
